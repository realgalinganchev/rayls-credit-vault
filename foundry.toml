[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200 # bumped from the Rayls starter's PoC value of 50
evm_version = "paris"

[lint]
exclude_lints = ["screaming-snake-case-immutable", "mixed-case-variable", "erc20-unchecked-transfer"]